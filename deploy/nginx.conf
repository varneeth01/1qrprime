server {
  listen 80;
  server_name _;

  # Docker's embedded DNS. Resolve the API service at request time so nginx
  # can boot even if the API container is still starting/restarting.
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  if ($host = www.1qrprime.com) {
    return 308 https://1qrprime.com$request_uri;
  }

  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok";
  }

  location /api/ {
    set $api_upstream "api:3000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 503 '{"error":"Service temporarily unavailable","code":"API_UNAVAILABLE"}';
  }

  location ~ ^/(login|signup|recovery|reset|verify|app|admin|staff|payment-routes)(/|$) {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/index.html /index.html;
  }
}
