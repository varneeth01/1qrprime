name: Release CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "shared/**"
      - "scripts/**"
      - "deploy/**"
      - "coolify.compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - coolify-production
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "shared/**"
      - "scripts/**"
      - "deploy/**"
      - "coolify.compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API and SQLite tests
        run: npm test

      - name: Database inventory
        run: npm run db:inventory

      - name: Build API and web
        run: npm run build

      - name: Run web validation tests
        run: npm run test:validation -w apps/web

      - name: Git diff check
        run: git diff --check
