name: Web SEO CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "shared/**"
      - "deploy/nginx.conf"
      - "deploy/Dockerfile"
      - "coolify.compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - coolify-production
    paths:
      - "apps/web/**"
      - "shared/**"
      - "deploy/nginx.conf"
      - "deploy/Dockerfile"
      - "coolify.compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web and generate static SEO routes
        run: npm run build -w apps/web

      - name: Run web validation tests
        run: npm run test:validation -w apps/web
