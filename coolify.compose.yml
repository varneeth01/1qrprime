services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api-runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_DRIVER: postgres
      DATABASE_PATH: /data/prime.sqlite
      MEDIA_ROOT: /data/media
      DATABASE_URL: ${POSTGRES_DATABASE_URL:?Set private PostgreSQL DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://1qrprime.com}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-https://api.1qrprime.com}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.1qrprime.com}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      AWS_REGION: ${AWS_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET for durable production media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:?Set S3_PUBLIC_ORIGIN for durable production media}
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@1qrprime.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set Resend SMTP password}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-1QR Prime}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@1qrprime.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set Razorpay key ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set Razorpay key secret}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_MIGRATION_MAX_WAIT_MS: ${PG_MIGRATION_MAX_WAIT_MS:-120000}
      PG_MIGRATION_CONNECT_TIMEOUT_MS: ${PG_MIGRATION_CONNECT_TIMEOUT_MS:-5000}
      PG_MIGRATION_MAX_BACKOFF_MS: ${PG_MIGRATION_MAX_BACKOFF_MS:-5000}
      PG_BOOTSTRAP_MAX_WAIT_MS: ${PG_BOOTSTRAP_MAX_WAIT_MS:-60000}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS:-10000}
    volumes:
      - prime-media:/data/media
    expose:
      - "3000"
    networks:
      - default
      - coolify-shared
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 150s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web-runtime
      args:
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    expose:
      - "80"
    networks:
      - default
      - coolify-shared
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD","wget","-q","--spider","http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

networks:
  coolify-shared:
    external: true
    name: ${COOLIFY_PREDEFINED_NETWORK:-coolify}

volumes:
  prime-media:
