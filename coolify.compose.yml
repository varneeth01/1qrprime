services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api-runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_DRIVER: postgres
      DATABASE_PATH: /data/prime.sqlite
      MEDIA_ROOT: /data/media
      DATABASE_URL: ${POSTGRES_DATABASE_URL:?Set private PostgreSQL DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://1qrprime.com}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-https://api.1qrprime.com}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.1qrprime.com}
      # Production media must use durable object storage. Keep local storage
      # available for development, but fail closed here if S3 is not configured.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      AWS_REGION: ${AWS_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET for durable production media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:?Set S3_PUBLIC_ORIGIN for durable production media}
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@1qrprime.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set Resend SMTP password}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-1QR Prime}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@1qrprime.com}
      # Razorpay credentials belong to the API runtime only. The web image
      # never receives the secret; the public key is returned by the API after
      # an authenticated order is created.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set Razorpay key ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set Razorpay key secret}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      # Coolify can start the app while its separately managed PostgreSQL
      # service is still joining the shared network or finishing a restart.
      # Keep the API process alive and retry instead of crash-looping.
      PG_MIGRATION_MAX_WAIT_MS: ${PG_MIGRATION_MAX_WAIT_MS:-120000}
      PG_MIGRATION_CONNECT_TIMEOUT_MS: ${PG_MIGRATION_CONNECT_TIMEOUT_MS:-5000}
      PG_MIGRATION_MAX_BACKOFF_MS: ${PG_MIGRATION_MAX_BACKOFF_MS:-5000}
      PG_BOOTSTRAP_MAX_WAIT_MS: ${PG_BOOTSTRAP_MAX_WAIT_MS:-60000}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS:-10000}
    volumes:
      - prime-media:/data/media
    expose:
      - "3000"
    # Keep API<->web traffic on the resource-private network, and attach only
    # the API to Coolify's shared destination network so it can resolve/reach
    # the standalone PostgreSQL resource by its internal container hostname.
    networks:
      - default
      - coolify-shared
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # Readiness (not just process liveness) is what the web service depends on.
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      # Migration/network retries can legitimately keep Fastify from listening
      # for up to two minutes during a cold database restart.
      start_period: 150s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web-runtime
      args:
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    # The static web shell must stay available even while the API/database is
    # restarting. Nginx can proxy API calls once the API comes back; blocking
    # web startup on API readiness turns any backend restart into a full-site
    # Cloudflare 504.
    expose:
      - "80"
    networks:
      - default
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL","wget -q -O - http://127.0.0.1/healthz | grep -q '^ok

networks:
  coolify-shared:
    external: true
    name: ${COOLIFY_PREDEFINED_NETWORK:-coolify}

volumes:
  prime-media:
"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

